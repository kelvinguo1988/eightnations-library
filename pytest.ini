[pytest]
# 测试必须完全离线：不联网、不读宿主 data/。
testpaths = tests
python_files = test_*.py
python_functions = test_*
# mutation_check.py / 辅助模块不是用例文件，明确排除以免被误收集
norecursedirs = data .git __pycache__ .pytest_cache
addopts = -q --strict-markers
markers =
    guard: 针对审查发现的缺陷的守卫测试（改坏业务代码就会红）
    web: Web 层（TestClient）测试
    structural: 模板/前端源码结构断言（grep 级）
