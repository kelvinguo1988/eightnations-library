name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一 ref 的连推排队跑：latest 的语义是"最新"，cancel-in-progress 会让
# 旧 commit 的构建后完成并把 latest 覆盖回旧版本，故只排队不取消。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # 回归前置于构建：语法（py_compile 全仓）+ pytest 全量 + pyflakes + 变异命中率，
  # 全绿才发镜像。测试必须离线（不联网、不读宿主 data/），否则 CI 不可复现。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.txt 只列镜像运行时依赖；playwright / pillow / pytest 属
        # 宿主机工具与测试依赖（刻意不进镜像），测试环境显式补
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pillow>=9.0" pytest pyflakes

      - name: Syntax check (py_compile)
        run: |
          find . -name '*.py' \
            -not -path './data/*' -not -path './.git/*' \
            -not -path '*/__pycache__/*' -print0 \
            | xargs -0 --no-run-if-empty python -m py_compile

      - name: pyflakes（静态检查，0 告警才过）
        run: python -m pyflakes core web sites tools scheduler.py manage.py tests conftest.py

      - name: pytest（用例数为 0 视为失败）
        # 审查 D P0：「pytest 报 no tests ran 却 exit 0」是假绿，必须显式断言数量。
        run: |
          set -o pipefail
          python -m pytest tests/ -q --junitxml=/tmp/junit.xml | tee /tmp/pytest.log
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("/tmp/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          fail = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"collected={total} failed={fail}")
          if total == 0:
              print("::error::测试用例数为 0（假绿），CI 失败")
              sys.exit(1)
          sys.exit(1 if fail else 0)
          PY

      - name: 变异命中率（守卫测试必须能抓住缺陷）
        # 审查 D P0：基线 8 个变异只有 3 个被抓 → 5 个"防线不存在"。
        # 本步要求全部变异被杀死；逃逸即说明某行为缺少可观测的测试覆盖。
        run: python tests/mutation_check.py

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 两平台在同一次 buildx 调用里构建：这样推上去的是一个 manifest list
          # （NAS 拉 latest 自动选架构）。若拆成 platform matrix 各自 push，
          # 后推的单架构 manifest 会覆盖前一个，NAS 就可能拉到错架构镜像。
          # 因此 buildx 这里只能挂一个缓存导出端（共享 scope）；并发导致的
          # 缓存互相挤掉已由上面的 concurrency 排队规避。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildx-multiarch
          cache-to: type=gha,mode=max,scope=buildx-multiarch
